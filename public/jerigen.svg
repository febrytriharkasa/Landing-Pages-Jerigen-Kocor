<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien Badan Jerigen (Luar) -->
    <linearGradient id="bodyBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Gradien Sisi Samping Kanan (Bayangan Soft) -->
    <linearGradient id="sideShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gradien Atas (Highlight Cahaya) -->
    <linearGradient id="topHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gradien Tutup Biru -->
    <linearGradient id="capBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Bayangan Bawah Logo -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Bayangan Dasar -->
  <ellipse cx="256" cy="455" rx="170" ry="25" fill="url(#dropShadow)" />

  <!-- Bodi Utama Jerigen -->
  <g>
    <!-- Sisi Belakang/Samping (Sumbu Kedalaman) -->
    <path d="M 160 140 
             C 220 120, 310 120, 360 145 
             C 390 160, 400 180, 400 230 
             V 380 
             C 400 420, 360 445, 310 445 
             C 250 445, 170 425, 140 390 
             C 120 365, 120 230, 120 200 
             C 120 165, 140 148, 160 140 Z" 
          fill="url(#bodyBase)" stroke="#CBD5E1" stroke-width="4" stroke-linejoin="round" />

    <!-- Sisi Depan Curved Overlay (Memberi Efek Volume 3D) -->
    <path d="M 140 390
             C 170 425, 250 445, 310 445
             C 360 445, 400 420, 400 380
             V 230
             C 400 200, 380 170, 335 160
             C 280 200, 170 230, 120 220
             V 360
             C 120 375, 128 385, 140 390 Z" 
          fill="url(#sideShadow)" />

    <!-- Cerukan Panel Depan (Indentasi Khas Jerigen Kocor) -->
    <path d="M 155 245
             C 220 240, 300 215, 370 190
             V 365
             C 340 390, 270 410, 155 370
             Z" 
          fill="none" stroke="#94A3B8" stroke-width="6" opacity="0.3" stroke-linejoin="round" />

    <!-- Bagian Atas / Bahu Jerigen -->
    <path d="M 160 140 
             C 210 125, 300 125, 360 145 
             C 380 153, 380 170, 335 185
             C 270 210, 170 220, 120 200
             C 120 175, 140 148, 160 140 Z" 
          fill="url(#topHighlight)" stroke="#E2E8F0" stroke-width="2" />

    <!-- Cekungan Pegangan (Handle Mold) di Atas -->
    <path d="M 210 148
             C 250 140, 290 145, 320 158
             C 310 168, 270 173, 220 168
             C 200 165, 195 155, 210 148 Z" 
          fill="#CBD5E1" opacity="0.6" />

    <!-- Gagang/Pegangan Jerigen -->
    <path d="M 225 142
             C 260 137, 295 142, 320 152
             C 325 158, 315 164, 295 162
             C 260 158, 230 156, 215 152
             C 210 147, 215 143, 225 142 Z" 
          fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- Tutup Jerigen (Biru) -->
  <g>
    <!-- Mulut Ulir Jerigen -->
    <ellipse cx="305" cy="166" rx="25" ry="14" fill="#64748B" />
    
    <!-- Bodi Utama Tutup Biru -->
    <path d="M 280 162
             V 176
             C 280 188, 330 188, 330 176
             V 162
             Z" 
          fill="url(#capBlue)" />

    <!-- Atas Tutup Biru -->
    <ellipse cx="305" cy="162" rx="25" ry="13" fill="#3B82F6" />
    <ellipse cx="305" cy="162" rx="21" ry="10" fill="#2563EB" />

    <!-- Garis Sisi / Gerigi Tutup Botol -->
    <line x1="285" y1="166" x2="285" y2="176" stroke="#1D4ED8" stroke-width="2" />
    <line x1="295" y1="170" x2="295" y2="181" stroke="#1D4ED8" stroke-width="2" />
    <line x1="305" y1="171" x2="305" y2="182" stroke="#1D4ED8" stroke-width="2" />
    <line x1="315" y1="170" x2="315" y2="180" stroke="#1D4ED8" stroke-width="2" />
    <line x1="325" y1="165" x2="325" y2="174" stroke="#1D4ED8" stroke-width="2" />
  </g>
</svg>
